<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Restaurant — AR Menu Platform</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="login-body">
  <div class="login-bg">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-brand">
        <div class="login-brand-icon"></div>
        <div>
          <div class="login-brand-name">AR Menu Platform</div>
          <div class="login-brand-tagline">Empower your dining experience</div>
        </div>
      </div>
      <div class="login-hero">
        <h1 class="login-headline">Join the future of<br><span class="gradient-text">Dining</span></h1>
        <p class="login-subtext">Register your restaurant today and let our team handle the AR menu creation for you.</p>
      </div>
    </div>

    <div class="login-right" style="overflow-y: auto; max-height: 100vh; padding: var(--space-4) var(--space-8);">
      <div class="login-card" style="margin: 40px 0;">
        <div class="login-card-header" style="margin-bottom: 20px;">
          <h2>Create Restaurant Account</h2>
          <p>Register and customize your digital menu</p>
        </div>

        <form id="signupForm" class="login-form" style="display:flex; flex-direction:column; gap:12px;">
          <div id="signupError" class="alert-banner alert-error hidden">
            <span class="alert-icon"></span>
            <span id="signupErrorText"></span>
          </div>

          <div class="form-group">
            <label class="form-label">Restaurant Name</label>
            <input type="text" id="restaurantName" class="form-control" placeholder="e.g. Olive Garden" required>
          </div>

          <div class="form-group">
            <label class="form-label">Owner Full Name</label>
            <input type="text" id="ownerName" class="form-control" placeholder="Enter your full name" required>
          </div>

          <div class="form-row" style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;">
              <label class="form-label">Business Email</label>
              <input type="email" id="email" class="form-control" placeholder="name@restaurant.com" required>
            </div>
            <div class="form-group" style="flex:1;">
              <label class="form-label">Phone Number</label>
              <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile" required>
            </div>
          </div>

          <div class="form-row" style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;">
              <label class="form-label">Create Password</label>
              <input type="password" id="password" class="form-control" placeholder="Min. 8 chars" required minlength="8">
            </div>
            <div class="form-group" style="flex:1;">
              <label class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Restaurant Address</label>
            <input type="text" id="address" class="form-control" placeholder="Full street address" required>
          </div>

          <div class="form-row" style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;">
              <label class="form-label">Restaurant Type</label>
              <select id="restaurantType" class="form-control" style="background:#12121a; color:#fff;" required>
                <option value="" disabled selected>Select type</option>
                <option value="fine_dining">Fine Dining</option>
                <option value="casual_dining">Casual Dining</option>
                <option value="fast_food">Fast Food / QSR</option>
                <option value="cafe">Cafe / Bakery</option>
                <option value="bar_pub">Bar / Pub</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label class="form-label">Number of Tables</label>
              <input type="number" id="tableCount" class="form-control" min="1" max="100" placeholder="e.g. 15" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">GST Number (Optional)</label>
            <input type="text" id="gstNumber" class="form-control" placeholder="15-digit GSTIN">
          </div>

          <div class="form-group" style="display:flex; align-items:center; gap:8px; margin: 8px 0;">
            <input type="checkbox" id="agreeTerms" required style="width:18px; height:18px; cursor:pointer;">
            <label for="agreeTerms" style="font-size:0.78rem; color:var(--text-muted); cursor:pointer;">
              I agree to the <a href="#" style="color:var(--primary-light);">Terms of Service</a> & <a href="#" style="color:var(--primary-light);">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="signupBtn" style="margin-top:8px;">
            <span>Create Restaurant Account</span>
          </button>
        </form>

        <div class="login-card-footer" style="margin-top:15px;">
          <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { showToast } from './js/utils.js?v=4';

    const SUPABASE_URL = 'https://fuezcrbfswgghawhfxrv.supabase.co';

    const form = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const errorBanner = document.getElementById('signupError');
    const errorText = document.getElementById('signupErrorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const restaurantName = document.getElementById('restaurantName').value.trim();
      const ownerName = document.getElementById('ownerName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const address = document.getElementById('address').value.trim();
      const gstNumber = document.getElementById('gstNumber').value.trim();
      const restaurantType = document.getElementById('restaurantType').value;
      const tableCount = document.getElementById('tableCount').value;

      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      signupBtn.disabled = true;
      signupBtn.querySelector('span').textContent = 'Processing...';
      errorBanner.classList.add('hidden');

      const payload = {
        restaurantName, ownerName, email, phone, password,
        address, gstNumber, restaurantType, tableCount
      };

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/register-restaurant`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Registration failed");

        // Save email & credentials locally to auto-login after OTP is verified
        localStorage.setItem('pending_signup_email', email);
        localStorage.setItem('pending_signup_credentials', JSON.stringify({ email, password }));

        showToast("Registration successful! Redirecting to verification...", "success");
        setTimeout(() => {
          window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
        }, 1200);

      } catch (err) {
        showError(err.message || 'Registration failed. Please try again.');
      } finally {
        signupBtn.disabled = false;
        signupBtn.querySelector('span').textContent = 'Create Restaurant Account';
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
    }
  </script>
</body>
</html>
